version: 2

sources:
  - name: bronze
    description: Parquet written by pipeline/ingest_lca.py. All columns are text, as published by DOL.
    tables:
      - name: lca
        description: >
          One row per LCA case per source file. Quarterly files (FY2024-FY2025) and
          year-to-date files (FY2026 Q3) are both present, so a case can appear more than once.
        meta:
          external_location: "read_parquet('data/bronze/lca/*.parquet', union_by_name = true)"
        columns:
          - name: case_number
            tests: [not_null]

      - name: uscis
        description: >
          USCIS H-1B Employer Data Hub export (pipeline/ingest_uscis.py), long format:
          one row per employer location, fiscal year and measure ("New Employment
          Approval", ...). All text. Employers carry the last 4 digits of their tax ID.
        meta:
          external_location: "read_parquet('data/bronze/uscis/*.parquet', union_by_name = true)"
        columns:
          - name: measure_name
            tests: [not_null]
