name: h1b_tracker
version: "1.0.0"
config-version: 2
profile: h1b_tracker

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Annual wages outside this range are treated as data-entry errors.
  min_valid_annual_wage: 15000
  max_valid_annual_wage: 1000000

models:
  h1b_tracker:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

seeds:
  h1b_tracker:
    role_family_rules:
      +column_types:
        priority: integer
        role_family: varchar
        pattern: varchar
        is_data_role: boolean
