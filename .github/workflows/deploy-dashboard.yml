name: Deploy dashboard

# Publishes dashboard/ to the resume site's Azure Storage static website under /h1b/.
on:
  push:
    branches: [main]
    paths: ["dashboard/**", "scripts/deploy_dashboard.sh", ".github/workflows/deploy-dashboard.yml"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure (no stored secrets)
  contents: read

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload and smoke-test
        env:
          SITE_STORAGE_ACCOUNT: ${{ vars.SITE_STORAGE_ACCOUNT }}
        run: bash scripts/deploy_dashboard.sh | tee -a "$GITHUB_STEP_SUMMARY"
