name: Refresh data from lake

# Daily: if the lake has new or changed bronze files (per the ingestion Function's
# manifests), rebuild the warehouse with dbt, re-export, deploy and commit the data.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the lake has not changed"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write # commit refreshed dashboard/data

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download manifests
        run: >
          mkdir -p build &&
          az storage blob download-batch --account-name "${{ vars.LAKE_ACCOUNT }}"
          --source bronze --pattern '_manifest/*.json' --destination build
          --auth-mode login --only-show-errors

      - name: Compare with the data the dashboard was built from
        id: check
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          lake = sorted((m["source_file"], m["sha256"]) for m in
                        (json.loads(p.read_text()) for p in pathlib.Path("build/_manifest").glob("*.json")))
          meta = json.loads(pathlib.Path("dashboard/data/meta.json").read_text())
          built = sorted((s["source_file"], s.get("sha256")) for s in meta.get("sources", []))
          changed = lake != built
          print("lake files:", len(lake), "| changed:", changed)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
          EOF

      - name: Download bronze Parquet (DOL + USCIS)
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: >
          mkdir -p data/bronze &&
          az storage blob download-batch --account-name "${{ vars.LAKE_ACCOUNT }}"
          --source bronze --pattern '*/*.parquet' --destination data/bronze
          --auth-mode login --only-show-errors && ls -la data/bronze/lca data/bronze/uscis

      - uses: actions/setup-python@v5
        if: steps.check.outputs.changed == 'true' || inputs.force
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Build warehouse and export
        if: steps.check.outputs.changed == 'true' || inputs.force
        env:
          MANIFEST_DIR: build/_manifest
        run: |
          pip install -r requirements.txt
          dbt build --project-dir transform --profiles-dir transform
          python -m pipeline.export_dashboard
          python -m pipeline.export_gold

      - name: Publish gold tables for the ask assistant
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: >
          az storage blob upload-batch --account-name "${{ vars.LAKE_ACCOUNT }}"
          --destination gold --destination-path marts --source data/gold
          --overwrite --auth-mode login --only-show-errors

      - name: Deploy dashboard
        if: steps.check.outputs.changed == 'true' || inputs.force
        env:
          SITE_STORAGE_ACCOUNT: ${{ vars.SITE_STORAGE_ACCOUNT }}
        run: bash scripts/deploy_dashboard.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed data
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "Refresh dashboard data from lake [skip ci]"
          git push
