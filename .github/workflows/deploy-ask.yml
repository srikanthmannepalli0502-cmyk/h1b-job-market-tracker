name: Deploy ask function

on:
  push:
    branches: [main]
    paths: ["ask/**", ".github/workflows/deploy-ask.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ask
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v tests/test_ask.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.ASK_FUNCTION_APP_NAME }}
          package: ask
          sku: flexconsumption
          remote-build: true

      - name: Smoke test (CORS + validation, no model call)
        run: |
          url="https://${{ vars.ASK_FUNCTION_APP_NAME }}.azurewebsites.net/api/ask"
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' -d '{"question": ""}')
            [ "$code" = "400" ] && break
            echo "waiting for the function ($code)..."; sleep 10
          done
          cat /tmp/body; echo
          [ "$code" = "400" ] || { echo "expected 400 for an empty question, got $code"; exit 1; }
