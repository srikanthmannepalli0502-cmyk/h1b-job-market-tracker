name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    name: Ingest tests + dbt build on fixture data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Build synthetic bronze data
        run: python -m tests.fixtures.make_bronze_fixture

      - name: dbt build (models + data tests)
        run: dbt build --project-dir transform --profiles-dir transform

      - name: Export dashboard data
        run: python -m pipeline.export_dashboard

      - name: pytest (ingestion + warehouse business logic)
        env:
          JOBS_FIXTURE: "1"
        run: pytest -v
